<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שולחן העבודה · פריים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/admin.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2315120F'/%3E%3Crect x='7' y='9' width='18' height='14' fill='none' stroke='%23C8371D' stroke-width='2.5'/%3E%3C/svg%3E">
</head>
<body class="page-admin">

<div class="gate" id="gate">
  <form class="gate-box" id="gateForm">
    <div class="logo"><span class="logo-mark"></span><span class="logo-word">פריים</span></div>
    <p class="kicker mono">STAFF ONLY · שולחן העבודה</p>
    <label class="fld"><span>קוד כניסה</span><input id="pin" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••"></label>
    <button class="btn btn-red">כניסה</button>
    <p class="muted gate-hint">בדמו הקוד הוא <b class="mono">1234</b></p>
  </form>
</div>

<div class="desk" id="desk" hidden>
  <aside class="side">
    <a href="index.html" class="logo"><span class="logo-mark"></span><span class="logo-word">פריים</span></a>
    <p class="side-who"><img id="meImg" alt=""><span><b id="meName"></b><br><small>מנהלת הקולקטיב</small></span></p>
    <nav class="side-nav" id="nav">
      <button data-view="desk" class="on"><span class="mono">01</span>לוח בקרה</button>
      <button data-view="inbox"><span class="mono">02</span>בקשות <i id="badge" class="badge"></i></button>
      <button data-view="cal"><span class="mono">03</span>יומן</button>
      <button data-view="team"><span class="mono">04</span>הצלמות</button>
      <button data-view="money"><span class="mono">05</span>עמלות</button>
      <button data-view="settings"><span class="mono">06</span>הגדרות</button>
    </nav>
    <a class="side-link" href="index.html" target="_blank">← לאתר הלקוחות</a>
  </aside>
  <main class="main" id="main"></main>
</div>

<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
